    <style>
      /* splash: aparece já no primeiro desenho, antes do JS */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #1a2550 0%, #0b1020 60%, #05070d 100%);
        color: #fff;
        pointer-events: none;
        transition: opacity 0.4s ease-out;
      }
      #splash.is-gone {
        opacity: 0;
      }
      #splash .sp-icon {
        position: relative;
        width: 120px;
        height: 120px;
      }
      #splash .sp-icon img {
        width: 100%;
        height: 100%;
        border-radius: 26px;
      }
      #splash .sp-bar {
        position: absolute;
        top: 4px;
        width: 40%;
        height: 16px;
        border-radius: 8px;
        filter: blur(6px);
        animation: sp-blink 0.5s steps(1) infinite;
      }
      #splash .sp-red {
        left: 8%;
        background: #ff3030;
      }
      #splash .sp-blue {
        right: 8%;
        background: #3a6bff;
        animation-delay: 0.25s;
      }
      #splash .sp-name {
        margin: 0;
        font:
          900 34px/1 system-ui,
          sans-serif;
        letter-spacing: 0.01em;
      }
      #splash .sp-name span {
        color: #ffcf4a;
      }
      @keyframes sp-blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" aria-hidden="true">
      <div class="sp-icon">
        <span class="sp-bar sp-red"></span><span class="sp-bar sp-blue"></span><img src="/icons/icon-192.png" alt="" />
      </div>
      <p class="sp-name">Polícia <span>×</span> Ladrão</p>
    </div>
